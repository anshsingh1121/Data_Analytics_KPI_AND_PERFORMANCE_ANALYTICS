tables:
  cert_task:
    mappings:
      task_id: sys_id
      task_number: number
      status: state
      assigned_to: assigned_to
      created_at: sys_created_on
      completed_at: closed_at
      due_date: due_date
      application: business_service
      config_item: cmdb_ci
      certification_cycle: activity_due  # Best available field; semantic meaning not fully confirmed
      description: short_description
      priority: priority
      assignment_group: assignment_group
    metadata:
      mapping_status: confirmed
      last_updated: '2026-10-23'
      confidence_notes: >
        All mapped columns were verified by the field audit.
        The semantic meaning of activity_due as certification_cycle
        should be validated against sample values.

  u_failed_data_certifications:
    mappings:
      discrepancy_id: sys_id
      linked_task: u_certification_task
      application: business_service
      field_name: short_description      # Provides discrepancy summary, not necessarily exact field name
      config_item: cmdb_ci
      issue_category: u_fcb_task_type
      created_at: sys_created_on
      resolved_at: closed_at
      status: state
      resolution_notes: close_notes
      issue_description: description
    metadata:
      mapping_status: confirmed
      last_updated: '2026-10-23'
      confidence_notes: >
        All mapped columns were verified by the field audit.
        short_description is being used as the closest available
        representation of field_name.
